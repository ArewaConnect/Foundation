<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#173b2b;background:radial-gradient(circle at 10% 5%,rgba(255,255,255,.98),transparent 28%),linear-gradient(135deg,#f8fafc 0%,#eaf4ff 38%,#fff0f1 72%,#eef6ff 100%)}
.page{max-width:1150px;margin:auto;padding:20px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;color:#166534;font-weight:bold}

<body><main class="page">

</header>
<section class="glass profile"><div class="avatar">FOUNDER</div><div><div class="role">Founder</div><h1>Engineer Aruna Dahiru Musawo</h1><p>Foundation leadership dashboard</p></div></section>

<script>
const wardNames=["Ward 1","Ward 2","Ward 3","Ward 4","Ward 5","Ward 6","Ward 7","Ward 8","Ward 9","Ward 10","Ward 11"];
const wards=wardNames.map((name,i)=>({id:i+1,name,registered:0,captured:0,verified:0}));
const fmt=n=>Number(n||0).toLocaleString(), pct=(n,d)=>d?Math.round(n/d*100):0;
function render(){
 let totals=wards.reduce((a,w)=>(a.rg+=w.registered,a.mc+=w.captured,a.vr+=w.verified,a),{rg:0,mc:0,vr:0});
 const beneficiaryShare = 0; // Placeholder until beneficiary data is connected.
 const chartItems=[
  {label:"Registered<br>voters (RG)",value:totals.rg,color:"blue"},
  {label:"Members<br>captured (MC)",value:totals.mc,color:"red"},
  {label:"Verified<br>members (VR)",value:totals.vr,color:"blue2"},
  {label:"Beneficiary<br>share",value:beneficiaryShare,color:"gray"}
 ];
 const maxValue=Math.max(1,...chartItems.map(x=>x.value));
 barChart.innerHTML=chartItems.map(x=>`<div class="bar-group"><div class="bar-value">${fmt(x.value)}</div><div class="bar ${x.color}" style="height:${Math.max(2,(x.value/maxValue)*78)}%"></div></div>`).join("");
 chartTotals.innerHTML=chartItems.map(x=>`<div class="chart-total"><small>${x.label.replace(/<br>/g," ")}</small><strong>${fmt(x.value)}</strong></div>`).join("");
 wardGrid.innerHTML=wards.map(w=>{let left=Math.max(w.registered-w.captured,0);return `<article class="glass ward"><div class="ward-head"><h3>${w.name}</h3></div><div class="ward-actions"><button class="ward-action-btn" type="button" onclick="openWard(${w.id})">See more details</button></div><div class="metrics">
 <div class="metric rg"><div class="pct">${pct(w.captured,w.registered)}%</div><div class="number">${fmt(w.registered)}</div><div class="caption">RG · Registered voters</div></div>
 <div class="metric mc"><div class="pct">${pct(w.captured,w.registered)}%</div><div class="number">${fmt(w.captured)}</div><div class="caption">MC · Members captured</div></div>
 <div class="metric vr"><div class="pct">${pct(w.verified,w.captured)}%</div><div class="number">${fmt(w.verified)}</div><div class="caption">VR · Verified members</div></div>
 <div class="metric remaining"><div class="pct">${pct(left,w.registered)}%</div><div class="number">${fmt(left)}</div><div class="caption">Remaining · Not captured</div></div></div></article>`}).join("");
}
function logout(){ window.location.href='index.html'; }
function openWard(id){alert("Ward Statistics page for "+wards.find(w=>w.id===id).name+" will be connected here.");}
function editWard(id){alert("Edit options for "+wards.find(w=>w.id===id).name+" will be connected here.");}
render();
</script>
<script>
/* Program photos will be loaded from the Admin section / Firebase data after admin uploads to Cloudinary. */
let programSlides = window.foundationProgramPhotos || [];
let currentProgramIndex = 0;
let programTimer = null;
function escapeProgramText(value){return String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderProgramCarousel(){
 const carousel=document.getElementById("programCarousel"),dots=document.getElementById("carouselDots");
 if(!carousel||!dots)return;
 if(!programSlides.length){carousel.innerHTML='<div class="program-slide active"><div class="program-image-placeholder"></div></div>';dots.innerHTML="";return;}
 carousel.innerHTML=programSlides.map((p,i)=>`<div class="program-slide ${i===currentProgramIndex?'active':''}"><img src="${p.url}" alt="${escapeProgramText(p.title||'Foundation program')}"></div>`).join("");
 dots.innerHTML=programSlides.map((p,i)=>`<button class="carousel-dot ${i===currentProgramIndex?'active':''}" aria-label="Show photo ${i+1}" onclick="showProgram(${i})"></button>`).join("");
}
function showProgram(index){if(!programSlides.length)return;currentProgramIndex=(index+programSlides.length)%programSlides.length;renderProgramCarousel();restartProgramTimer();}
function restartProgramTimer(){if(programTimer)clearInterval(programTimer);if(programSlides.length>1)programTimer=setInterval(()=>showProgram(currentProgramIndex+1),5000);}
document.addEventListener("DOMContentLoaded",()=>{renderProgramCarousel();restartProgramTimer();});
</script>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",
  authDomain: "ehfoundation-48f1d.firebaseapp.com",
  projectId: "ehfoundation-48f1d",
  storageBucket: "ehfoundation-48f1d.firebasestorage.app",
  messagingSenderId: "126063666222",
  appId: "1:126063666222:web:8793cae852361441fb6bbf"
};

const foundationApp = initializeApp(firebaseConfig, "FounderMembersCount");
const foundationDb = getFirestore(foundationApp);

async function updateRegisteredMembersCount() {
  const countElement = document.getElementById("memberCount");
  if (!countElement) return;

  try {
    const result = await getCountFromServer(collection(foundationDb, "members"));
    countElement.textContent = Number(result.data().count || 0).toLocaleString();
  } catch (error) {
    console.error("Could not load member count:", error);
    countElement.textContent = "—";
    countElement.title = "Could not load count. Check Firebase login and Firestore rules.";
  }
}

updateRegisteredMembersCount();
</script>
