<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#173b2b;background:radial-gradient(circle at 10% 5%,rgba(255,255,255,.98),transparent 28%),linear-gradient(135deg,#f8fafc 0%,#eaf4ff 38%,#fff0f1 72%,#eef6ff 100%)}

.glass{background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.88);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-radius:24px;box-shadow:0 16px 38px rgba(30,64,175,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 20px;margin-bottom:24px}.avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#dcfce7,#dbeafe);border:4px solid white;display:grid;place-items:center;color:#166534;font-weight:bold;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.role{font-size:13px;color:#1d4ed8;font-weight:bold;letter-spacing:1px;text-transform:uppercase}.profile h1{font-size:clamp(22px,4vw,32px);margin:7px 0}.profile p{margin:0;color:#64748b}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 2px 14px}.heading h2{margin:0}.pill{background:#ffffffa8;border-radius:30px;padding:8px 12px;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.summary-card{padding:17px;border-top:4px solid #2563eb}.summary-card:nth-child(2){border-top-color:#dc2626}.summary-card:nth-child(3){border-top-color:#1d4ed8}.label{color:#64748b;font-size:13px}.big{font-size:32px;font-weight:800;margin-top:7px}
.wards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ward{padding:16px;cursor:pointer;transition:.2s}.ward:hover{transform:translateY(-3px)}.ward-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ward h3{margin:0}.ward-head span{font-size:12px;color:#1d4ed8;font-weight:bold}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:12px;border-radius:13px;background:#ffffffbd;min-height:88px}.pct{font-size:12px;color:#1d4ed8;font-weight:bold}.number{font-size:25px;font-weight:800;margin-top:3px}.caption{font-size:11px;color:#64748b;margin-top:4px}.rg{border-left:5px solid #2563eb;background:linear-gradient(135deg,rgba(239,246,255,.92),rgba(255,255,255,.72))}.mc{border-left:5px solid #dc2626;background:linear-gradient(135deg,rgba(254,242,242,.92),rgba(255,255,255,.72))}.vr{border-left:5px solid #1d4ed8;background:linear-gradient(135deg,rgba(239,246,255,.92),rgba(255,255,255,.72))}.remaining{border-left:5px solid #64748b;background:linear-gradient(135deg,rgba(248,250,252,.92),rgba(255,255,255,.72))}
.note{font-size:12px;color:#64748b;margin-top:15px}footer{text-align:center;font-size:12px;color:#64748b;margin:25px 0}

.chart-panel{padding:20px;margin-bottom:22px}

.bar-group{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}

@media(max-width:640px){.page{padding:12px 10px}.glass{border-radius:22px}.wards{grid-template-columns:1fr;gap:12px}.profile{padding:20px 15px;flex-direction:column;align-items:center;text-align:center}.avatar{width:108px;height:108px}.heading{align-items:flex-start;flex-direction:column}.ward{padding:14px}.metric{padding:11px}.chart-panel{padding:14px}.chart-area{height:230px}.chart-legend{gap:8px}.chart-totals{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-value{font-size:10px}}

/* Enhanced frosted-glass styling inspired by the supplied login screen */
body{
 background:
   radial-gradient(ellipse at 12% 8%, rgba(22,163,74,.20), transparent 26%),
   radial-gradient(ellipse at 92% 18%, rgba(37,99,235,.18), transparent 30%),
   radial-gradient(ellipse at 85% 78%, rgba(220,38,38,.15), transparent 28%),
   linear-gradient(145deg,#f5f8fc 0%,#eaf1f8 42%,#f7f3f5 72%,#edf5f8 100%);
 background-attachment:fixed;
 position:relative;
}
body:before{
 content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:
  linear-gradient(145deg,transparent 0 7%,rgba(22,163,74,.92) 7.2% 8.3%,transparent 8.5%),
  linear-gradient(145deg,transparent 0 10%,rgba(37,99,235,.9) 10.2% 11.3%,transparent 11.5%),
  linear-gradient(145deg,transparent 0 13%,rgba(220,38,38,.88) 13.2% 14.3%,transparent 14.5%),
  linear-gradient(325deg,transparent 0 7%,rgba(22,163,74,.9) 7.2% 8.3%,transparent 8.5%),
  linear-gradient(325deg,transparent 0 10%,rgba(37,99,235,.88) 10.2% 11.3%,transparent 11.5%),
  linear-gradient(325deg,transparent 0 13%,rgba(220,38,38,.86) 13.2% 14.3%,transparent 14.5%);
 opacity:.72;
}
.glass{
 background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.48));

 backdrop-filter:blur(26px) saturate(165%);

}
.program-carousel{

}
.metric,.chart-total,.pill{

 -webkit-backdrop-filter:blur(12px);
}

<noscript><div style="padding:12px;text-align:center;color:#b91c1c">JavaScript must be enabled to load the Founder Dashboard.</div></noscript>
<script type="module">
import {initializeApp, getApps, getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, doc, getDoc, collection, getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",authDomain:"ehfoundation-48f1d.firebaseapp.com",projectId:"ehfoundation-48f1d",storageBucket:"ehfoundation-48f1d.firebasestorage.app",messagingSenderId:"126063666222",appId:"1:126063666222:web:8793cae852361441fb6bbf"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString(),pct=(n,d)=>d?Math.round(n/d*100):0;
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(message){if($("dashboardStatus"))$("dashboardStatus").textContent=message||"";}
$("logoutBtn")?.addEventListener("click",async()=>{try{await signOut(auth);location.href="index.html";}catch(e){status("Logout failed: "+e.message);}});
function showError(message){status(message);$("founderName").textContent="Founder Dashboard";$("wardGrid").innerHTML=`<article class="glass ward"><p>${safe(message)}</p></article>`;}

function timestampMillis(value){
  if(value && typeof value.toMillis==="function") return value.toMillis();
  if(value && typeof value.seconds==="number") return value.seconds*1000;
  const n=Date.parse(value||"");
  return Number.isFinite(n)?n:0;
}
async function loadFounderProfile(){
  // Super Admin publishes the latest profile to this shared document.
  // Founder access is granted explicitly in Firestore rules; no collection-wide adminProfiles query is needed.
  const snap=await getDoc(doc(db,"foundationSettings","profile"));
  if(!snap.exists()){
    $("founderName").textContent="Founder profile unavailable";
    $("founderPhoto").hidden=true;
    $("founderAvatarFallback").hidden=false;
    throw new Error("No shared profile document exists at foundationSettings/profile. Open Super Admin → Administrator Profile, then click Save Profile. The Super Admin page must successfully publish this profile before the Founder Dashboard can display it.");
  }
  const data=snap.data()||{};
  if(!data.displayName && !data.photoUrl){
    $("founderName").textContent="Founder profile incomplete";
    throw new Error("The shared founder profile has no displayName or photoUrl.");
  }
  $("founderName").textContent=data.displayName||"Founder";
  if(data.photoUrl){
    $("founderPhoto").onerror=()=>{ $("founderPhoto").hidden=true; $("founderAvatarFallback").hidden=false; };
    $("founderPhoto").onload=()=>{ $("founderPhoto").hidden=false; $("founderAvatarFallback").hidden=true; };
    $("founderPhoto").src=data.photoUrl;
  }else{
    $("founderPhoto").hidden=true;
    $("founderAvatarFallback").hidden=false;
  }
}

let programSlides=[],currentProgramIndex=0,programTimer=null;
function renderProgramCarousel(){
  const carousel=$("programCarousel"),dots=$("carouselDots");if(!carousel||!dots)return;
  if(!programSlides.length){carousel.innerHTML='<div class="program-slide active"><div class="program-image-placeholder"></div><div class="program-caption"><h3>No programme photographs yet</h3><p>Photos uploaded in Super Admin will appear here.</p></div></div>';dots.innerHTML="";return;}
  currentProgramIndex=Math.min(currentProgramIndex,programSlides.length-1);
  carousel.innerHTML=programSlides.map((p,i)=>`<div class="program-slide ${i===currentProgramIndex?"active":""}"><img src="${safe(p.imageUrl)}" alt="${safe(p.caption||"Foundation programme")}"><div class="program-caption"><h3>${safe(p.caption||"Foundation programme")}</h3></div></div>`).join("");
  dots.innerHTML=programSlides.map((p,i)=>`<button class="carousel-dot ${i===currentProgramIndex?"active":""}" aria-label="Show photo ${i+1}" data-program-index="${i}"></button>`).join("");
}
function showProgram(index){if(!programSlides.length)return;currentProgramIndex=(index+programSlides.length)%programSlides.length;renderProgramCarousel();restartProgramTimer();}
function restartProgramTimer(){if(programTimer)clearInterval(programTimer);if(programSlides.length>1)programTimer=setInterval(()=>showProgram(currentProgramIndex+1),5000);}
$("carouselDots")?.addEventListener("click",e=>{const b=e.target.closest("[data-program-index]");if(b)showProgram(Number(b.dataset.programIndex));});
async function loadProgrammeGallery(){
  try{
    const snap=await getDocs(collection(db,"foundationPublicGallery"));
    programSlides=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(p=>p.imageUrl)
      .sort((a,b)=>timestampMillis(b.createdAt)-timestampMillis(a.createdAt));
    currentProgramIndex=0;renderProgramCarousel();restartProgramTimer();
  }catch(error){
    programSlides=[];
    const carousel=$("programCarousel"),dots=$("carouselDots");
    if(carousel)carousel.innerHTML=`<div class="program-slide active"><div class="program-image-placeholder"></div><div class="program-caption"><h3>Programme gallery unavailable</h3><p>${safe(error.message||"The Founder account needs read access to foundationPublicGallery. Super Admin needs write access to publish programme photos.")}</p></div></div>`;
    if(dots)dots.innerHTML="";
    throw error;
  }
}

function voterLocation(m){const code=String(m.voterCardCode||"").replace(/\s/g,"");return /^\d{9}$/.test(code)?{stateId:code.slice(0,2),lgaId:code.slice(2,4),wardId:code.slice(4,6)}:null;}
async function loadWardHierarchy(){
  const wards=[],states=await getDocs(collection(db,"states"));
  for(const s of states.docs){
    const sd=s.data()||{},lgas=await getDocs(collection(db,"states",s.id,"lgas"));
    for(const l of lgas.docs){
      const ld=l.data()||{},ws=await getDocs(collection(db,"states",s.id,"lgas",l.id,"wards"));
      for(const w of ws.docs){const wd=w.data()||{};wards.push({id:`${s.id}_${l.id}_${w.id}`,stateId:s.id,lgaId:l.id,wardId:w.id,stateName:sd.name||s.id,lgaName:ld.name||l.id,name:wd.name||w.id});}
    }
  }
  return wards;
}
function renderStatistics(members,wardList){
  const map=new Map(wardList.map(w=>[w.id,{...w,codes:new Set(),captured:0,verified:0,beneficiaries:0}]));
  const allCodes=new Set(),roleCounts={"Team Leader":0,"Polling Unit Agent":0,"Mobilization Agent":0};
  let verifiedTotal=0,beneficiaryTotal=0;
  for(const m of members){
    if(roleCounts[m.category]!==undefined)roleCounts[m.category]++;
    const loc=voterLocation(m);
    if(loc){
      const code=String(m.voterCardCode).replace(/\s/g,"");allCodes.add(code);
      const w=map.get(`${loc.stateId}_${loc.lgaId}_${loc.wardId}`);
      if(w){w.codes.add(code);w.captured++;if(m.verified===true)w.verified++;if(Array.isArray(m.benefits)&&m.benefits.length)w.beneficiaries++;}
    }
    if(m.verified===true)verifiedTotal++;
    if(Array.isArray(m.benefits)&&m.benefits.length)beneficiaryTotal++;
  }
  $("teamLeaderCount").textContent=fmt(roleCounts["Team Leader"]);
  $("puAgentCount").textContent=fmt(roleCounts["Polling Unit Agent"]);
  $("mobilizationAgentCount").textContent=fmt(roleCounts["Mobilization Agent"]);
  $("memberCount").textContent=fmt(members.filter(m=>m.category==="Member").length);
  const rows=[...map.values()].map(w=>({...w,registered:w.codes.size}));
  const totals={rg:allCodes.size,mc:members.length,vr:verifiedTotal,beneficiary:beneficiaryTotal};
  const items=[{label:"Registered voters (RG)",value:totals.rg,color:"blue"},{label:"Members captured (MC)",value:totals.mc,color:"red"},{label:"Verified members (VR)",value:totals.vr,color:"blue2"},{label:"Beneficiary share",value:totals.beneficiary,color:"gray"}];
  const max=Math.max(1,...items.map(x=>x.value));
  $("barChart").innerHTML=items.map(x=>`<div class="bar-group"><div class="bar-value">${fmt(x.value)}</div><div class="bar ${x.color}" style="height:${Math.max(2,x.value/max*78)}%"></div></div>`).join("");
  $("chartTotals").innerHTML=items.map(x=>`<div class="chart-total"><small>${safe(x.label)}</small><strong>${fmt(x.value)}</strong></div>`).join("");
  $("wardGrid").innerHTML=rows.length?rows.map(w=>{
    const remaining=Math.max(w.registered-w.captured,0);
    return `<article class="glass ward"><div class="ward-head"><h3>${safe(w.name)}</h3><span>${safe(w.lgaName)}, ${safe(w.stateName)}</span></div>
    <div class="ward-actions"><button class="ward-action-btn" type="button" data-open-ward data-state="${safe(w.stateId)}" data-lga="${safe(w.lgaId)}" data-ward="${safe(w.wardId)}">See more details</button></div>
    <div class="metrics">
      <div class="metric rg"><div class="pct">${pct(w.captured,w.registered)}%</div><div class="number">${fmt(w.registered)}</div><div class="caption">RG · Registered voters</div></div>
      <div class="metric mc"><div class="pct">${pct(w.captured,w.registered)}%</div><div class="number">${fmt(w.captured)}</div><div class="caption">MC · Members captured</div></div>
      <div class="metric vr"><div class="pct">${pct(w.verified,w.captured)}%</div><div class="number">${fmt(w.verified)}</div><div class="caption">VR · Verified members</div></div>
      <div class="metric remaining"><div class="pct">${pct(remaining,w.registered)}%</div><div class="number">${fmt(remaining)}</div><div class="caption">Remaining · Not captured</div></div>
      <div class="metric"><div class="pct">${pct(w.beneficiaries,w.captured)}%</div><div class="number">${fmt(w.beneficiaries)}</div><div class="caption">Beneficiaries · Received assistance</div></div>
    </div></article>`;
  }).join(""):'<article class="glass ward"><p>No wards have been created in Super Admin yet.</p></article>';
}
async function loadDashboardData(){
  status("Connecting to Firebase…");
  const errors=[];
  try{
    const [ms,wards]=await Promise.all([
      getDocs(collection(db,"members")),
      loadWardHierarchy()
    ]);
    const members=ms.docs.map(d=>({id:d.id,...d.data()}));
    renderStatistics(members,wards);
  }catch(e){
    console.error("Member/ward statistics query failed:",e);
    errors.push("Statistics: "+e.message);
    // Keep the chart populated with an explicit error state instead of an empty white panel.
    $("barChart").innerHTML='<div style="width:100%;display:grid;place-items:center;color:#64748b;text-align:center;padding:24px">Statistics could not be loaded. Check Firebase access to members and states.</div>';
    $("chartTotals").innerHTML='<div class="chart-total" style="grid-column:1/-1"><small>Statistics status</small><strong style="font-size:13px">'+safe(e.message)+'</strong></div>';
    $("wardGrid").innerHTML=`<article class="glass ward"><p>Could not load member or ward statistics: ${safe(e.message)}</p></article>`;
  }
  try{await loadFounderProfile();}
  catch(e){
    console.error("Founder profile query failed:",e);
    errors.push("Founder profile: "+e.message);
    if($("founderName").textContent.includes("Loading"))$("founderName").textContent="Founder profile unavailable";
    $("founderPhoto").hidden=true;$("founderAvatarFallback").hidden=false;
  }
  try{await loadProgrammeGallery();}
  catch(e){console.error("Programme gallery query failed:",e);errors.push("Programme gallery: "+e.message);}
  status(errors.length ? "Some Firebase queries were blocked or failed. "+errors.join(" | ") : "Dashboard data successfully loaded from Firebase.");
}
document.querySelector(".mobilization-strip")?.addEventListener("click",e=>{
  const button=e.target.closest("[data-open-category]");
  if(!button)return;
  const params=new URLSearchParams({category:button.dataset.openCategory});
  location.href="members-record.html?"+params.toString();
});
$("wardGrid")?.addEventListener("click",e=>{
  const b=e.target.closest("[data-open-ward]");if(!b)return;
  const p=new URLSearchParams({state:b.dataset.state,lga:b.dataset.lga,ward:b.dataset.ward});
  location.href="members-record.html?"+p.toString();
});
onAuthStateChanged(auth,async user=>{
  if(!user){showError("Your login session is not available. Sign in with the Founder account, then reopen this dashboard.");return;}
  try{
    const snap=await getDoc(doc(db,"userAccounts",user.uid));
    if(!snap.exists()){showError("Your account profile was not found. Ask Super Admin to create a Founder account.");return;}
    const a=snap.data()||{},role=String(a.role||"").toLowerCase(),perms=Array.isArray(a.permissions)?a.permissions:[];
    const allowed=a.active!==false&&(a.superAdmin===true||role==="founder"||role==="super_admin"||role==="admin"||perms.includes("founder-dashboard"));
    if(!allowed){showError("Access denied. Your account must be active and have Founder Dashboard permission.");return;}
    await loadDashboardData();
  }catch(e){console.error(e);showError("Could not load dashboard data: "+(e.message||"Check Firebase access and Firestore rules."));}
});
</script>
