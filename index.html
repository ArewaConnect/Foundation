<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087d24">
  <title> | Engineer Haruna Foundation</title>
  <style>
:root{--green:#079b16;--green-dark:#006b12;--red:#ed1c24;--blue:#10a9e5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{
 min-height:100vh;min-height:100dvh;font-family:Inter,"Segoe UI",Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;padding:22px 18px;overflow-x:hidden;
 background:
 radial-gradient(ellipse at 4% 34%,rgba(8,150,42,.25),transparent 25%),
 radial-gradient(ellipse at 92% 66%,rgba(15,166,225,.25),transparent 30%),
 radial-gradient(ellipse at 78% 82%,rgba(236,25,35,.18),transparent 25%),
 linear-gradient(135deg,#f5faff 0%,#e8f2ff 48%,#f8fbff 100%);
 position:relative
}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;filter:blur(.5px)}
body:before{
 top:-90px;left:-130px;width:490px;height:260px;
 background:linear-gradient(145deg,#079b16 0 30%,#fff 30% 42%,#10a9e5 42% 57%,#ed1c24 57% 69%,transparent 69%);
 border-radius:0 0 100% 0;transform:rotate(-8deg)
}
body:after{
 right:-180px;bottom:-115px;width:760px;height:300px;
 background:linear-gradient(165deg,transparent 0 22%,#079b16 22% 39%,#fff 39% 49%,#10a9e5 49% 64%,#ed1c24 64% 77%,transparent 77%);
 border-radius:100% 0 0 0;transform:rotate(-5deg)
}
.page{position:relative;z-index:1;width:min(100%,500px);display:flex;flex-direction:column;align-items:center;gap:28px}
.foundation-logo{display:flex;justify-content:center;align-items:center;width:100%;margin:0;padding:0}
.foundation-logo img{display:block;width:clamp(250px,68vw,390px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:50%;mix-blend-mode:multiply}
.login-card{
 width:100%;padding:clamp(25px,5vw,42px);border-radius:34px;
 background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.9);
 box-shadow:0 18px 42px rgba(30,48,70,.18),inset 0 1px 0 rgba(255,255,255,.9);
 backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)
}
h1{display:none}
.field{display:flex;align-items:center;gap:18px;min-height:96px;margin-bottom:28px;padding:0 28px;border-radius:27px;
 background:rgba(255,255,255,.94);border:1px solid rgba(220,226,235,.9);box-shadow:0 8px 15px rgba(30,45,65,.14)}
.field:focus-within{border-color:#079b16;box-shadow:0 0 0 3px rgba(7,155,22,.12),0 8px 15px rgba(30,45,65,.14)}
.field-icon{width:42px;height:42px;color:#41464d;flex:0 0 auto}
.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:clamp(22px,4.2vw,32px);color:#172b48}
.field input::placeholder{color:#73777d;opacity:1}
.toggle-password{border:0;background:transparent;color:#41464d;cursor:pointer;padding:6px;display:grid;place-items:center}
.toggle-password svg{width:35px;height:35px}
.login-button{width:100%;min-height:98px;margin-top:22px;border:0;border-radius:27px;color:#fff;
 background:linear-gradient(110deg,#00a80a,#006b10);font-size:clamp(28px,5vw,38px);font-weight:800;cursor:pointer;
 box-shadow:0 10px 18px rgba(0,105,20,.24);transition:transform .15s,filter .15s}
.login-button:hover{filter:brightness(1.04)}.login-button:active{transform:translateY(1px)}.login-button:disabled{opacity:.7;cursor:wait}
.message{display:none;margin:16px 0 0;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;background:#fff7e6;color:#684800;border:1px solid #f1d99e}
.message.show{display:block}
@media(max-width:600px){
 body{padding:18px 30px}
 .page{gap:28px}
 .foundation-logo img{width:min(82vw,570px)}
 .login-card{padding:26px 40px;border-radius:32px}
 .field{min-height:96px;margin-bottom:28px;padding:0 24px;gap:16px}
 .field-icon{width:42px;height:42px}
 .login-button{min-height:98px;margin-top:22px}
}
@media(max-height:900px) and (max-width:600px){
 body{padding-top:12px;padding-bottom:12px}
 .page{gap:18px}
 .foundation-logo img{width:min(58vh,340px)}
 .login-card{padding:22px 26px}
 .field{min-height:70px;margin-bottom:18px;padding:0 18px}
 .field-icon{width:34px;height:34px}
 .field input{font-size:23px}
 .toggle-password svg{width:28px;height:28px}
 .login-button{min-height:72px;margin-top:12px;font-size:29px}
}

/* Refined moderate-size login layout */
body{padding:20px 16px}
.page{width:min(100%,390px);gap:18px}
.foundation-logo img{width:clamp(145px,38vw,205px)}
.login-card{padding:22px;border-radius:22px}
.field{min-height:58px;margin-bottom:14px;padding:0 16px;gap:12px;border-radius:16px}
.field-icon{width:25px;height:25px}
.field input{font-size:17px}
.toggle-password{padding:4px}
.toggle-password svg{width:23px;height:23px}
.login-button{min-height:58px;margin-top:8px;border-radius:16px;font-size:20px;font-weight:700}
.message{font-size:13px}
@media(max-width:600px){
 body{padding:18px 18px}
 .page{width:min(100%,360px);gap:16px}
 .foundation-logo img{width:clamp(135px,40vw,185px)}
 .login-card{padding:20px;border-radius:20px}
 .field{min-height:56px;margin-bottom:13px;padding:0 14px;gap:11px}
 .field-icon{width:24px;height:24px}
 .field input{font-size:16px}
 .toggle-password svg{width:22px;height:22px}
 .login-button{min-height:56px;margin-top:7px;font-size:19px}
}
@media(max-height:650px) and (max-width:600px){
 body{padding:10px 16px}
 .page{gap:10px}
 .foundation-logo img{width:110px}
 .login-card{padding:15px}
 .field{min-height:48px;margin-bottom:9px}
 .login-button{min-height:48px}
}


/* Latest refinement: larger centered foundation logo and slim full-width fields */
.page{width:min(100%,430px);gap:17px}
.foundation-logo{width:100%;justify-content:center}
.foundation-logo img{width:clamp(175px,45vw,235px);max-width:100%}
.login-card{width:100%;padding:20px 22px;border-radius:20px}
.field{width:100%;min-height:48px;margin-bottom:12px;padding:0 15px;gap:12px;border-radius:12px}
.field-icon{width:23px;height:23px}
.field input{font-size:16px}
.toggle-password svg{width:21px;height:21px}
.login-button{width:100%;min-height:50px;margin-top:7px;border-radius:12px;font-size:19px}
@media(max-width:600px){
 body{padding:16px 14px}
 .page{width:100%;max-width:430px;gap:15px}
 .foundation-logo img{width:clamp(175px,48vw,230px)}
 .login-card{width:100%;padding:18px 16px;border-radius:18px}
 .field{min-height:46px;margin-bottom:11px;padding:0 13px;border-radius:11px}
 .field-icon{width:22px;height:22px}
 .field input{font-size:16px}
 .login-button{min-height:48px;font-size:18px}
}

</style>

</head>
<body>
  <main class="page">
    <div class="foundation-logo"><img src="logo.png" alt="Engineer Haruna Foundation logo"></div>
    <section class="login-card" aria-label="Login form">
<form id="loginForm">
        <label class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 21v-2a8 8 0 0 1 16 0v2H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <input id="username" name="email" type="email" placeholder="Email address" autocomplete="username" required>
        </label>

        <label class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="10" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 10V7a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="15.5" r="1.4" fill="currentColor"/>
            <path d="M12 17v2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
        </label>

        <button class="login-button" type="submit"><span aria-hidden="true">➜</span> &nbsp; Login</button>
        <p class="message" id="message" role="status"></p>
      </form>
    </section>
</main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",
      authDomain: "ehfoundation-48f1d.firebaseapp.com",
      projectId: "ehfoundation-48f1d",
      storageBucket: "ehfoundation-48f1d.firebasestorage.app",
      messagingSenderId: "126063666222",
      appId: "1:126063666222:web:8793cae852361441fb6bbf"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const message = document.getElementById('message');

    togglePassword.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      document.getElementById('eyeIcon').innerHTML = show
        ? '<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 5.2A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
    });

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const loginButton = document.querySelector('.login-button');
      const email = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      message.classList.add('show');
      message.textContent = 'Signing in…';
      loginButton.disabled = true;

      try {
        // Firebase Authentication requires the account's email and password.
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const user = credential.user;

        // Verify this user's role profile using their Firebase Auth UID.
        const profileRef = doc(db, 'userAccounts', user.uid);
        const profileSnap = await getDoc(profileRef);

        if (!profileSnap.exists()) {
          await signOut(auth);
          throw new Error('Your login is valid, but your Firestore userAccounts profile was not found. Ask Super Admin to save your profile using your Firebase Authentication UID.');
        }

        const profile = profileSnap.data();
        if (profile.active !== true) {
          await signOut(auth);
          throw new Error('Your account is inactive. Please contact Super Admin.');
        }

        const role = String(profile.role || '').trim();
        const allowedRoles = ['Founder', 'Registration Agent', 'Admin', 'admin', 'Super Admin', 'super_admin'];
        if (!allowedRoles.includes(role) && profile.superAdmin !== true) {
          await signOut(auth);
          throw new Error('Your account role is not recognized. Please contact Super Admin.');
        }

        const permissions = Array.isArray(profile.permissions) ? profile.permissions : [];
        const permissionText = permissions.length ? permissions.join(', ') : 'No page permissions assigned';

        message.textContent = 'Login and Firestore verification successful. Role: ' + role + '. Permissions: ' + permissionText + '.';
        message.style.background = '#eaf8ee';
        message.style.color = '#14532d';
        message.style.borderColor = '#bbf7d0';

        // Keep the authenticated session active and redirect according to Firestore role.
        let dashboard = '';
        if (profile.superAdmin === true || role === 'Super Admin' || role === 'super_admin') {
          dashboard = 'super-admin-dashboard.html';
        } else if (role === 'Founder') {
          dashboard = 'backup-founder-dashboard.html';
        } else if (role === 'Registration Agent') {
          dashboard = 'registration.html';
        } else if (role === 'Admin' || role === 'admin') {
          dashboard = 'admin-dashboard.html';
        }

        if (!dashboard) {
          throw new Error('No dashboard is configured for role: ' + role);
        }

        sessionStorage.setItem('ehFoundationRole', role);
        sessionStorage.setItem('ehFoundationPermissions', JSON.stringify(permissions));

        setTimeout(() => {
          window.location.href = dashboard;
        }, 700);
      } catch (error) {
        let text = error?.message || 'Login failed.';
        if (error?.code === 'auth/invalid-credential' || error?.code === 'auth/wrong-password' || error?.code === 'auth/user-not-found') {
          text = 'Incorrect email or password. Please check your Firebase Authentication account.';
        } else if (error?.code === 'permission-denied') {
          text = 'Firestore denied access to your user profile. Check that the rules allow a signed-in user to read userAccounts/{their UID}.';
        } else if (error?.code === 'auth/network-request-failed') {
          text = 'Network connection failed. Check your internet and try again.';
        }
        message.textContent = text;
        message.style.background = '';
        message.style.color = '';
        message.style.borderColor = '';
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
