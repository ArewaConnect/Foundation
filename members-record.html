<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members Record | Engineer Haruna Foundation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;font-family:Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:14px 10px;overflow:hidden}

body{background:linear-gradient(135deg,#e8f5f8,#f7fbfd);position:relative}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0}
body:before{top:-100px;left:-120px;width:430px;height:230px;background:linear-gradient(145deg,#10a9e5 0 42%,white 42% 52%,#ed1c24 52% 70%,transparent 70%);border-radius:0 0 100% 0}
body:after{right:-160px;bottom:-120px;width:650px;height:260px;background:linear-gradient(165deg,transparent 0 24%,#079b16 24% 42%,white 42% 52%,#10a9e5 52% 68%,#ed1c24 68% 80%,transparent 80%);border-radius:100% 0 0 0}

.records-wrap{position:relative;z-index:1;width:min(100%,760px);margin:0 auto}
.records-scroll{height:calc(100dvh - 28px);overflow-y:auto;overscroll-behavior:contain;padding:3px 3px 20px;scrollbar-width:thin;scrollbar-color:rgba(0,120,25,.4) transparent}
.record-card{margin:0 0 12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.53);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 25px rgba(35,50,65,.12),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.record-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:11px;align-items:start}
.member-photo{width:84px;height:100px;border-radius:11px;border:1px solid #b6d9c2;background:linear-gradient(145deg,#e8f4eb,#dcecf5);display:flex;align-items:center;justify-content:center;color:#438153;text-align:center;font-size:11px;overflow:hidden}
.member-photo img{width:100%;height:100%;object-fit:cover}
.member-info{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.member-name{grid-column:1/-1;font-size:17px;font-weight:800;color:#164b2b;line-height:1.2;margin:0 0 2px;overflow-wrap:anywhere}
.info{font-size:12px;color:#5a675f;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.info strong{display:block;font-size:11px;color:#244332;font-weight:750;margin-bottom:2px}
.details-below{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:7px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.55)}
.details-title{grid-column:1/-1;font-size:11px;font-weight:800;color:#197234}
.bottom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;padding:0 2px}
.polling-unit{min-width:0;flex:1}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:nowrap;margin:0}
.action{white-space:nowrap;padding:7px 10px;font-size:11px}
.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:750;cursor:pointer}
.whatsapp{background:#16a34a;color:white}.sms{background:#e8f4eb;color:#17652c;border:1px solid #c9e5d0}
@media(max-width:420px){body{padding:8px}.records-scroll{height:calc(100dvh - 16px)}.record-card{padding:9px;border-radius:15px;margin-bottom:9px}.record-top{grid-template-columns:76px minmax(0,1fr);gap:8px}.member-photo{width:76px;height:90px}.member-name{font-size:15px}.info{font-size:11px}.info strong{font-size:10px}.details-below{padding:7px;gap:6px 8px}
.bottom-row{gap:6px;align-items:flex-end}
.actions{gap:5px}
.action{font-size:10px;padding:7px 8px}
.polling-unit{font-size:10px}
} 
@media(max-width:350px){.bottom-row{flex-wrap:wrap}.actions{width:100%;justify-content:flex-end}}
</style></head>
<body><main class="records-wrap"><section class="records-scroll" id="recordsList">

<div id="loadingRecords" style="text-align:center;padding:25px;color:#164b2b">Loading registered members...</div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",authDomain:"ehfoundation-48f1d.firebaseapp.com",projectId:"ehfoundation-48f1d",storageBucket:"ehfoundation-48f1d.firebasestorage.app",messagingSenderId:"126063666222",appId:"1:126063666222:web:8793cae852361441fb6bbf"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function esc(v){return String(v??'Not provided').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizePhone(phone){let digits=String(phone||'').replace(/\D/g,'');if(digits.startsWith('0'))digits='234'+digits.slice(1);return digits}
function card(m,id){const ward=m.wardName||m.wardCode||'Not provided',lga=m.lgaName||m.lgaCode||'Not provided',pu=m.pollingUnitName||m.pollingUnitCode||'Not provided';
return `<article class="record-card" data-phone="${esc(m.phone||'')}"><div class="record-top"><div class="member-photo">${m.photoDataUrl?`<img src="${m.photoDataUrl}" alt="Member photo">`:'Member<br>Photo'}</div><div class="member-info"><h2 class="member-name">${esc(m.fullName)}</h2><div class="info"><strong>Role</strong>${esc(m.category)}</div><div class="info"><strong>Gender</strong>${esc(m.gender)}</div><div class="info"><strong>Age</strong>${esc(m.age)}</div><div class="info"><strong>Account Name</strong>${esc(m.accountName)}</div><div class="info"><strong>Account Number</strong>${esc(m.accountNumber)}</div></div></div><div class="details-below"><div class="details-title">Voter / Contact Details</div><div class="info"><strong>Phone Number</strong>${esc(m.phone)}</div><div class="info"><strong>Voter’s Card Number</strong>${esc(m.voterCardCode)}</div><div class="info"><strong>Ward</strong>${esc(ward)}</div><div class="info"><strong>Local Government</strong>${esc(lga)}</div></div><div class="bottom-row"><div class="info polling-unit"><strong>Polling Unit</strong>${esc(pu)}</div><div class="actions"><a class="action whatsapp" href="#" data-action="whatsapp">WhatsApp</a><a class="action sms" href="#" data-action="sms">Send Message</a></div></div></article>`;}
const list=document.getElementById('recordsList');

function showError(message){
  list.innerHTML='<div style="padding:20px;color:#a00">'+esc(message)+'</div>';
}

auth.onAuthStateChanged(async user=>{
  if(!user){
    showError('Your login session is not available. Please return to the login page and sign in again.');
    return;
  }

  try{
    // Verify this signed-in user's Firestore role profile before loading records.
    const profileSnap=await db.collection('userAccounts').doc(user.uid).get();
    if(!profileSnap.exists){
      showError('Your account profile was not found in Firestore. Contact the Super Admin.');
      return;
    }

    const profile=profileSnap.data()||{};
    const role=String(profile.role||'');
    const permissions=Array.isArray(profile.permissions)?profile.permissions:[];
    const active=profile.active===true;
    const superAdmin=profile.superAdmin===true||role==='Super Admin'||role==='super_admin';
    const admin=role==='Admin'||role==='admin';

    if(!active){
      showError('Your account is inactive. Contact the Super Admin.');
      return;
    }

    if(!(superAdmin||admin||permissions.includes('members-record'))){
      showError('Your account does not have the Members Record permission.');
      return;
    }

    db.collection('members').orderBy('createdAt','desc').onSnapshot(snap=>{
      if(!snap.size){
        list.innerHTML='<div style="text-align:center;padding:25px;color:#164b2b">No registrations have been saved yet.</div>';
        return;
      }
      list.innerHTML=snap.docs.map(d=>card(d.data(),d.id)).join('');
    },err=>{
      console.error('Members query failed:',err);
      showError('Firestore denied access to members. Confirm your account has the members-record permission in userAccounts/'+user.uid+' and that Firestore rules use this permission.');
    });
  }catch(err){
    console.error('Profile verification failed:',err);
    showError('Unable to verify your account profile: '+(err.message||'Firestore access denied.'));
  }
});
document.addEventListener('click',e=>{const link=e.target.closest('[data-action]');if(!link)return;e.preventDefault();const phone=link.closest('.record-card')?.dataset.phone||'';if(!phone){alert('Member phone number is not available.');return;}if(link.dataset.action==='whatsapp')window.open('https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent('Hello, '),'_blank','noopener');else window.location.href='sms:'+phone;});
</script></body></html>
