<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members Record | Engineer Haruna Foundation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;font-family:Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:14px 10px;overflow:hidden}

body{background:linear-gradient(135deg,#e8f5f8,#f7fbfd);position:relative}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0}
body:before{top:-100px;left:-120px;width:430px;height:230px;background:linear-gradient(145deg,#10a9e5 0 42%,white 42% 52%,#ed1c24 52% 70%,transparent 70%);border-radius:0 0 100% 0}
body:after{right:-160px;bottom:-120px;width:650px;height:260px;background:linear-gradient(165deg,transparent 0 24%,#079b16 24% 42%,white 42% 52%,#10a9e5 52% 68%,#ed1c24 68% 80%,transparent 80%);border-radius:100% 0 0 0}

.records-wrap{position:relative;z-index:1;width:min(100%,760px);margin:0 auto}
.records-scroll{height:calc(100dvh - 28px);overflow-y:auto;overscroll-behavior:contain;padding:3px 3px 20px;scrollbar-width:thin;scrollbar-color:rgba(0,120,25,.4) transparent}
.record-card{margin:0 0 12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.53);border:2px solid #1685d8;box-shadow:0 10px 25px rgba(35,50,65,.12),0 0 0 1px rgba(22,133,216,.12),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.record-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:11px;align-items:start}
.member-photo{width:84px;height:100px;border-radius:11px;border:1px solid #b6d9c2;background:linear-gradient(145deg,#e8f4eb,#dcecf5);display:flex;align-items:center;justify-content:center;color:#438153;text-align:center;font-size:11px;overflow:hidden}
.member-photo img{width:100%;height:100%;object-fit:cover}
.member-info{min-width:0;display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:7px 10px}
/* Keep Role, Gender and Age on one line; the other columns adjust to the role width. */
.member-info .info:nth-child(2),.member-info .info:nth-child(3),.member-info .info:nth-child(4){white-space:nowrap;min-width:max-content}
.member-name-row{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 2px;min-width:0}
.member-name{font-size:17px;font-weight:800;color:#164b2b;line-height:1.2;margin:0;overflow-wrap:anywhere;min-width:0}
.member-name-label{white-space:nowrap}
.verify-badge{display:inline-flex;align-items:center;gap:5px;flex:none;border:1px solid #cbd5d1;border-radius:999px;padding:3px 7px;background:#f1f3f2;color:#647067;font-size:9px;font-weight:800;line-height:1;letter-spacing:.15px}
.verify-badge.is-verified{background:#e8f7ed;border-color:#a8d9b7;color:#176b35}
.verify-colors{display:inline-flex;gap:2px;align-items:center}
.verify-colors i{display:block;width:5px;height:9px;border-radius:1px}
.verify-colors i:nth-child(1){background:#858b91}.verify-colors i:nth-child(2){background:#e3343f}.verify-colors i:nth-child(3){background:#168b43}
.info{font-size:12px;color:#5a675f;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.info strong{display:block;font-size:11px;color:#244332;font-weight:750;margin-bottom:2px}
.details-below{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px 10px;margin-top:5px;padding:6px 10px;border-radius:11px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.55)}
.details-title{grid-column:1/-1;font-size:11px;font-weight:800;color:#197234}
.bottom-row{display:flex;flex-direction:column;align-items:stretch;gap:5px;margin-top:5px;padding:0 2px}
.polling-unit{min-width:0;flex:1}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;justify-content:center;gap:8px;width:100%;margin:0}
.action{white-space:nowrap;padding:10px 6px;font-size:11px;min-height:38px;width:100%;}
.action{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:0;border-radius:9px;padding:9px 6px;font-size:12px;font-weight:750;cursor:pointer}
.call{background:#176b35;color:#fff}.whatsapp{background:#16a34a;color:white}.sms{background:#e8f4eb;color:#17652c;border:1px solid #c9e5d0}
@media(max-width:420px){body{padding:8px}.records-scroll{height:calc(100dvh - 16px)}.record-card{padding:9px;border-radius:15px;margin-bottom:9px}.record-top{grid-template-columns:76px minmax(0,1fr);gap:8px}.member-photo{width:76px;height:90px}.member-name{font-size:15px}.info{font-size:11px}.info strong{font-size:10px}.details-below{grid-template-columns:repeat(4,minmax(0,1fr));padding:7px;gap:6px 5px}.bottom-row{gap:8px}.actions{gap:6px}.action{font-size:10px;padding:9px 3px;min-height:36px}.info{overflow-wrap:anywhere}
} 
@media(max-width:350px){.member-info{gap:6px 5px}.details-below{gap:5px 3px}.details-below .info{font-size:9px}.details-below .info strong{font-size:9px}.actions{gap:4px}.action{font-size:9px;padding:8px 2px}}

.records-wrap{height:calc(100dvh - 28px);display:flex;flex-direction:column;gap:9px}
.foundation-header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.9);border-radius:16px;background:linear-gradient(110deg,rgba(255,255,255,.92),rgba(231,246,250,.88));box-shadow:0 8px 22px rgba(35,50,65,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.foundation-brand{font-size:clamp(15px,4vw,20px);font-weight:850;color:#164b2b;line-height:1.2}
.foundation-subtitle{font-size:10px;color:#61756a;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
.back-button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:#176b35;color:#fff;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 3px 9px rgba(23,107,53,.18)}
.back-button:active{transform:scale(.97)}
.records-scroll{height:auto;min-height:0;flex:1;overflow-y:auto}

.filters-panel{display:flex;flex-direction:column;gap:9px;width:100%;margin:0 0 11px;padding:11px;border:1px solid rgba(255,255,255,.9);border-radius:15px;background:rgba(255,255,255,.82);box-shadow:0 6px 17px rgba(35,50,65,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.filter-field{width:100%;min-width:0;display:flex;flex-direction:column;gap:5px}
.filter-field label,.filter-heading{font-size:11px;font-weight:800;color:#245337}
.filter-field input,.filter-field select{width:100%;min-width:0;height:40px;padding:0 11px;border:1px solid #cbded1;border-radius:9px;background:#fff;color:#34483b;font-size:13px;outline:none}
.filter-field input:focus,.filter-field select:focus{border-color:#17934a;box-shadow:0 0 0 2px rgba(23,147,74,.12)}
.filter-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:9px;border:1px solid #dce9df;border-radius:10px;background:rgba(255,255,255,.72);max-height:190px;overflow-y:auto}
.filter-option{display:flex;align-items:center;gap:7px;min-width:0;padding:5px 6px;border-radius:7px;background:#f5faf6;color:#405b49;font-size:12px;overflow-wrap:anywhere}
.filter-option input{width:16px;height:16px;flex:none;accent-color:#168b43}
.filter-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clear-filter{border:1px solid #c9e5d0;border-radius:8px;background:#e8f4eb;color:#17652c;padding:7px 11px;font-size:11px;font-weight:800}
.filter-count{font-size:11px;color:#607267;text-align:right}
@media(max-width:480px){.records-wrap{height:calc(100dvh - 16px)}.foundation-header{padding:11px 10px}.back-button{padding:8px 9px;font-size:11px}.filters-panel{padding:9px}.filter-options{grid-template-columns:repeat(2,minmax(0,1fr))}}


.details-below .info strong{white-space:nowrap}
.member-info .info strong{white-space:nowrap}

</style></head>
<body><main class="records-wrap">
<header class="foundation-header">
  <div>
    <div class="foundation-brand">Engineer Haruna Foundation</div>
    <div class="foundation-subtitle">Registered Members Record</div>
  </div>
  <a class="back-button" href="founder-dashboard.html" aria-label="Back to Founder Dashboard">← Back</a>
</header>
<section class="records-scroll">
  <div class="filters-panel" aria-label="Member record filters">
    <div class="filter-field">
      <label for="searchName">Search by name</label>
      <input id="searchName" type="search" placeholder="Enter member name..." autocomplete="off">
    </div>
    <div class="filter-field">
      <label for="filterType">Choose what to filter</label>
      <select id="filterType">
        <option value="">Select a filter category...</option>
        <option value="role">Role</option>
        <option value="gender">Gender</option>
        <option value="age">Age</option>
        <option value="accountName">Account name</option>
        <option value="accountNumber">Account number</option>
        <option value="phone">Phone number</option>
        <option value="lga">Local government</option>
        <option value="ward">Ward</option>
        <option value="pu">Polling unit</option>
      </select>
    </div>
    <div class="filter-heading" id="filterOptionsTitle">Select a filter category to display options</div>
    <div class="filter-options" id="filterOptions">
      <div style="grid-column:1/-1;color:#718078;font-size:12px">Choose a category above. You can tick more than one option.</div>
    </div>
    <div class="filter-actions">
      <button type="button" class="clear-filter" id="clearFilters">Clear filters</button>
      <div class="filter-count" id="filterCount">Loading records...</div>
    </div>
  </div>
  <div id="recordsList">
    <div id="loadingRecords" style="text-align:center;padding:25px;color:#164b2b">Loading registered members...</div>
  </div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",authDomain:"ehfoundation-48f1d.firebaseapp.com",projectId:"ehfoundation-48f1d",storageBucket:"ehfoundation-48f1d.firebasestorage.app",messagingSenderId:"126063666222",appId:"1:126063666222:web:8793cae852361441fb6bbf"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function esc(v){return String(v??'Not provided').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizePhone(phone){let digits=String(phone||'').replace(/\D/g,'');if(digits.startsWith('0'))digits='234'+digits.slice(1);return digits}

// Member list and filter state (required before rendering cards).
const list=document.getElementById('recordsList');
const members=[];
const searchName=document.getElementById('searchName');
const filterType=document.getElementById('filterType');
const filterOptions=document.getElementById('filterOptions');
const filterOptionsTitle=document.getElementById('filterOptionsTitle');
const filterCount=document.getElementById('filterCount');
const selectedValues=new Set();

const filterDefinitions={
  role:{label:'Role',get:m=>m.category},
  gender:{label:'Gender',get:m=>m.gender},
  age:{label:'Age',get:m=>m.age},
  accountName:{label:'Account name',get:m=>m.accountName},
  accountNumber:{label:'Account number',get:m=>m.accountNumber},
  phone:{label:'Phone number',get:m=>m.phone},
  lga:{label:'Local government',get:m=>m.lgaName||m.lgaCode},
  ward:{label:'Ward',get:m=>m.wardName||m.wardCode},
  pu:{label:'Polling unit',get:m=>m.pollingUnitName||m.pollingUnitCode}
};

function valueForFilter(member,key){
  const raw=filterDefinitions[key].get(member);
  return String(raw??'').trim();
}
function renderRecords(){
  const query=searchName.value.trim().toLocaleLowerCase();
  const key=filterType.value;
  const filtered=members.filter(item=>{
    const m=item.data;
    if(!String(m.fullName||'').toLocaleLowerCase().includes(query))return false;
    if(key&&selectedValues.size&&!selectedValues.has(valueForFilter(m,key)))return false;
    return true;
  });
  list.innerHTML=filtered.length?filtered.map(item=>card(item.data,item.id)).join(''):
    '<div style="text-align:center;padding:25px;color:#536b5c;background:rgba(255,255,255,.65);border-radius:14px">No members match the selected search and filters.</div>';
  filterCount.textContent='Showing '+filtered.length+' of '+members.length+' members';
}
function buildFilterOptions(){
  const key=filterType.value;
  selectedValues.clear();
  if(!key||!filterDefinitions[key]){
    filterOptionsTitle.textContent='Select a filter category to display options';
    filterOptions.innerHTML='<div style="grid-column:1/-1;color:#718078;font-size:12px">Choose a category above. You can tick more than one option.</div>';
    renderRecords();
    return;
  }
  const definition=filterDefinitions[key];
  const values=[...new Set(members.map(item=>valueForFilter(item.data,key)).filter(Boolean))].sort((a,b)=>{
    if(key==='age')return Number(a)-Number(b);
    return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
  });
  filterOptionsTitle.textContent='Tick one or more '+definition.label.toLowerCase()+' options';
  if(!values.length){
    filterOptions.innerHTML='<div style="grid-column:1/-1;color:#718078;font-size:12px">No values available for this category.</div>';
  }else{
    filterOptions.innerHTML=values.map((value,index)=>{
      const id='filterChoice'+index;
      return '<label class="filter-option" for="'+id+'"><input type="checkbox" id="'+id+'" value="'+esc(value)+'"><span>'+esc(value)+'</span></label>';
    }).join('');
    filterOptions.querySelectorAll('input[type="checkbox"]').forEach(box=>{
      box.addEventListener('change',()=>{
        if(box.checked)selectedValues.add(box.value);
        else selectedValues.delete(box.value);
        renderRecords();
      });
    });
  }
  renderRecords();
}
function updateFilterOptions(){
  // Rebuild options for the currently selected filter after Firestore updates.
  buildFilterOptions();
}
searchName.addEventListener('input',renderRecords);
filterType.addEventListener('change',buildFilterOptions);
document.getElementById('clearFilters').addEventListener('click',()=>{
  searchName.value='';
  filterType.value='';
  selectedValues.clear();
  buildFilterOptions();
});

// Resolve the complete nine-digit voter card code against the location
// hierarchy created in the Super Admin dashboard. Names are not guessed.
const locationCache=new Map();
async function resolveLocation(m){
  const digits=String(m.voterCardCode||'').replace(/\s+/g,'');
  if(!/^\d{9}$/.test(digits))return m;
  const stateCode=digits.slice(0,2),lgaCode=digits.slice(2,4),wardCode=digits.slice(4,6),puCode=digits.slice(6,9);
  if(locationCache.has(digits))return {...m,...locationCache.get(digits)};
  const result={stateCode,lgaCode,wardCode,pollingUnitCode:puCode};
  try{
    const state=await db.collection('states').doc(stateCode).get();
    if(!state.exists)return {...m,...result};
    result.stateName=state.data().name;
    const lga=await state.ref.collection('lgas').doc(lgaCode).get();
    if(!lga.exists)return {...m,...result};
    result.lgaName=lga.data().name;
    const ward=await lga.ref.collection('wards').doc(wardCode).get();
    if(!ward.exists)return {...m,...result};
    result.wardName=ward.data().name;
    const pu=await ward.ref.collection('pollingUnits').doc(puCode).get();
    if(pu.exists)result.pollingUnitName=pu.data().name;
    locationCache.set(digits,result);
  }catch(error){
    console.warn('Location name lookup unavailable:',error);
  }
  return {...m,...result};
}

function card(m,id){
  // The combined voter code contains State(2), LGA(2), Ward(2), PU(3).
  const voterCode=String(m.voterCardCode||'').replace(/\s/g,'');
  const validVoterCode=/^\d{9}$/.test(voterCode);
  const state=m.stateName||m.stateCode||(validVoterCode?voterCode.slice(0,2):'Not provided');
  const lga=m.lgaName||m.lgaCode||(validVoterCode?voterCode.slice(2,4):'Not provided');
  const ward=m.wardName||m.wardCode||(validVoterCode?voterCode.slice(4,6):'Not provided');
  const pu=m.pollingUnitName||m.pollingUnitCode||(validVoterCode?voterCode.slice(6,9):'Not provided');
  const bank=m.bankName||m.bank||'Not provided';
  return `<article class="record-card" data-phone="${esc(m.phone||'')}">
    <div class="record-top">
      <div class="member-photo">${m.photoDataUrl?`<img src="${m.photoDataUrl}" alt="Member photo">`:'Member<br>Photo'}</div>
      <div class="member-info">
        <div class="member-name-row"><h2 class="member-name"><span class="member-name-label">Name:</span> ${esc(m.fullName)}</h2><span class="verify-badge ${m.verified===true?'is-verified':''}" title="${m.verified===true?'Verified by an administrator':'Awaiting administrator verification'}"><span class="verify-colors" aria-hidden="true"><i></i><i></i><i></i></span>${m.verified===true?'Verified':'Pending'}</span></div>
        <div class="info"><strong>Role</strong>${esc(m.category)}</div>
        <div class="info"><strong>Gender</strong>${esc(m.gender)}</div>
        <div class="info"><strong>Age</strong>${esc(m.age)}</div>
        <div class="info"><strong>Account Name</strong>${esc(m.accountName)}</div>
        <div class="info"><strong>ACC NO</strong>${esc(m.accountNumber)}</div>
        <div class="info"><strong>Bank Name</strong>${esc(bank)}</div>
        <div class="info"><strong>Business Type</strong>${esc(m.businessType)}</div>
      </div>
    </div>
    <div class="details-below">
      <div class="info"><strong>State</strong>${esc(state)}</div>
      <div class="info"><strong>L.G.</strong>${esc(lga)}</div>
      <div class="info"><strong>Ward</strong>${esc(ward)}</div>
      <div class="info"><strong>Polling Unit</strong>${esc(pu)}</div>
    </div>
    <div class="bottom-row">
      <div class="actions">
        <a class="action call" href="#" data-action="call">Call</a>
        <a class="action whatsapp" href="#" data-action="whatsapp">WhatsApp</a>
        <a class="action sms" href="#" data-action="sms">Send Message</a>
      </div>
    </div>
  </article>`;
};

function showError(message){
  list.innerHTML='<div style="padding:20px;color:#a00">'+esc(message)+'</div>';
}

auth.onAuthStateChanged(async user=>{
  if(!user){
    showError('Your login session is not available. Please return to the login page and sign in again.');
    return;
  }

  try{
    // Verify this signed-in user's Firestore role profile before loading records.
    const profileSnap=await db.collection('userAccounts').doc(user.uid).get();
    if(!profileSnap.exists){
      showError('Your account profile was not found in Firestore. Contact the Super Admin.');
      return;
    }

    const profile=profileSnap.data()||{};
    const role=String(profile.role||'');
    const permissions=Array.isArray(profile.permissions)?profile.permissions:[];
    const active=profile.active===true;
    const superAdmin=profile.superAdmin===true||role==='Super Admin'||role==='super_admin';
    const admin=role==='Admin'||role==='admin';

    if(!active){
      showError('Your account is inactive. Contact the Super Admin.');
      return;
    }

    if(!(superAdmin||admin||permissions.includes('members-record'))){
      showError('Your account does not have the Members Record permission.');
      return;
    }

    let snapshotVersion=0;
    db.collection('members').orderBy('createdAt','desc').onSnapshot(async snap=>{
      const version=++snapshotVersion;
      const resolved=await Promise.all(snap.docs.map(async d=>({id:d.id,data:await resolveLocation(d.data())})));
      if(version!==snapshotVersion)return;
      members.splice(0,members.length,...resolved);
      updateFilterOptions();
      renderRecords();
    },err=>{
      console.error('Members query failed:',err);
      showError('Firestore denied access to members. Confirm your account has the members-record permission in userAccounts/'+user.uid+' and that Firestore rules use this permission.');
    });
  }catch(err){
    console.error('Profile verification failed:',err);
    showError('Unable to verify your account profile: '+(err.message||'Firestore access denied.'));
  }
});
document.addEventListener('click',e=>{const link=e.target.closest('[data-action]');if(!link)return;e.preventDefault();const phone=link.closest('.record-card')?.dataset.phone||'';if(!phone){alert('Member phone number is not available.');return;}if(link.dataset.action==='call')window.location.href='tel:'+phone;else if(link.dataset.action==='whatsapp')window.open('https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent('Hello, '),'_blank','noopener');else window.location.href='sms:'+phone;});
</script></body></html>
