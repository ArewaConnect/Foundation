<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087d24"><title>Programme Dashboard | Engineer Haruna Foundation</title>
<style>
:root{--green:#078b25;--dark:#075c20;--line:#d8e7dc}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f8f5;color:#173b28}
header{background:#087d24;color:white;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
main{max-width:980px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1232}
h1,h2,h3{margin-top:0}.muted{color:#65756b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#eef8f0;border-radius:12px;padding:13px}.stat b{display:block;font-size:25px;color:var(--dark)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}.programme{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}
.beneficiary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border-top:1px solid #e4ece6;padding:13px 0}
.badge{border-radius:20px;padding:5px 9px;background:#fff3cd;color:#7c5a00;font-size:12px;font-weight:bold}
.badge.done{background:#dcfce7;color:#166534}.empty{padding:20px;text-align:center;color:#667}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.beneficiary{grid-template-columns:1fr auto}.beneficiary .amount{grid-column:1}.beneficiary label{grid-column:2;grid-row:1/3}}
</style></head><body>
<header><div><strong>Engineer Haruna Foundation</strong><div>Programme Coordinator Dashboard</div></div><button id="logoutBtn">Logout</button></header>
<main><section class="panel"><h1 id="welcome">Welcome</h1><p class="muted">Only programmes assigned to your account are shown here.</p>
<div class="stats"><div class="stat"><b id="programmeCount">0</b>Assigned programmes</div><div class="stat"><b id="beneficiaryCount">0</b>Beneficiaries</div><div class="stat"><b id="receivedCount">0</b>Receipts confirmed</div></div><p id="pageStatus" class="muted">Loading your programmes…</p></section>
<section class="panel"><h2>My Assigned Programmes</h2><div id="programmeList"><div class="empty">Loading…</div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs,query,where,updateDoc,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const config={apiKey:"AIzaSyD6jNo0Qkqan5Ar0o0CGv3oarRdIF8rvIk",authDomain:"ehfoundation-48f1d.firebaseapp.com",projectId:"ehfoundation-48f1d",storageBucket:"ehfoundation-48f1d.firebasestorage.app",messagingSenderId:"126063666222",appId:"1:126063666222:web:8793cae852361441fb6bbf"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let currentUser=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){$("pageStatus").textContent="Your session has ended. Redirecting to login…";location.href="index.html";return;}
 currentUser=u;
 try{
  const profileSnap=await getDoc(doc(db,"userAccounts",u.uid));
  if(!profileSnap.exists())throw new Error("Account profile was not found.");
  const profile=profileSnap.data(),roles=["Programme Coordinator","Programme Supervisor","Programme Agent"];
  if(profile.active!==true||!roles.includes(profile.role)){await signOut(auth);throw new Error("This account is not an active programme coordinator.");}
  $("welcome").textContent="Welcome, "+(profile.fullName||profile.username||"Coordinator");
  await loadAssignedProgrammes();
 }catch(e){$("pageStatus").textContent="Access error: "+e.message;}
});
async function loadAssignedProgrammes(){
 const snap=await getDocs(query(collection(db,"programmes"),where("coordinatorId","==",currentUser.uid)));
 let total=0,receivedTotal=0;const cards=[];
 for(const pDoc of snap.docs){
  const p=pDoc.data(),bSnap=await getDocs(collection(db,"programmes",pDoc.id,"beneficiaries"));
  total+=bSnap.size;const received=bSnap.docs.filter(d=>d.data().status==="received").length;receivedTotal+=received;
  const rows=bSnap.empty?'<p class="muted">No beneficiaries have been assigned yet.</p>':bSnap.docs.map(d=>{
   const b=d.data(),done=b.status==="received";
   return `<div class="beneficiary"><div><strong>${esc(b.memberName||"Member")}</strong><div class="muted">${esc(b.memberLocation||"")}</div></div><div class="amount"><strong>${Number(b.allocatedQuantity||0).toLocaleString()}</strong> ${esc(b.unit||p.unit||"")}</div><label><input type="checkbox" data-receipt="${esc(d.id)}" data-program="${esc(pDoc.id)}" ${done?"checked disabled":""}> ${done?"Received":"Confirm received"}</label></div>`;
  }).join("");
  cards.push(`<article class="programme"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.assistanceType||"")} · ${esc(p.description||"")}</p><p><strong>Allocation:</strong> ${Number(p.allocatedQuantity||0).toLocaleString()} / ${Number(p.totalQuantity||0).toLocaleString()} ${esc(p.unit||"")}</p><p><strong>Beneficiaries:</strong> ${bSnap.size} · <strong>Received:</strong> ${received}</p>${rows}</article>`);
 }
 $("programmeCount").textContent=snap.size;$("beneficiaryCount").textContent=total;$("receivedCount").textContent=receivedTotal;
 $("programmeList").innerHTML=cards.length?cards.join(""):'<div class="empty">No programmes have been assigned to you yet.</div>';
 $("pageStatus").textContent="Your programme information is up to date.";
}
document.addEventListener("change",async e=>{
 const box=e.target.closest("[data-receipt]");if(!box||!box.checked)return;
 box.disabled=true;const pid=box.dataset.program,bid=box.dataset.receipt;
 try{
  const ref=doc(db,"programmes",pid,"beneficiaries",bid),snap=await getDoc(ref);
  if(!snap.exists())throw new Error("Beneficiary assignment was not found.");
  if(snap.data().status!=="received"){
   await updateDoc(ref,{status:"received",receivedAt:serverTimestamp(),receivedBy:currentUser.uid});
   await addDoc(collection(db,"distributionAudit"),{programmeId:pid,beneficiaryId:bid,memberId:snap.data().memberId||"",action:"received",performedBy:currentUser.uid,timestamp:serverTimestamp()});
  }
  await loadAssignedProgrammes();
 }catch(err){box.checked=false;box.disabled=false;alert("Could not confirm receipt: "+err.message);}
});
</script></body></html>
